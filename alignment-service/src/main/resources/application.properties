spring.application.name=alignment-service

# Kafka Consumer Configuration
spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=alignment_group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Ignore the type information sent in the message. 
# Instead, just try to fit the incoming JSON data into the Java class that the listener method is expecting
# This is because group id might be different for different services, and hence the type information might not match
spring.kafka.consumer.properties.spring.json.use.type.headers=false
# Specify the default type to deserialize to if type information is not available in headers
spring.kafka.consumer.properties.spring.json.value.default.type=com.bioinformatics_pipeline.alignment_service.dto.FileIngestionEvent

# Kafka Producer Configuration
spring.kafka.producer.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer