version: '3.8'

services:
  ingestion-service:
    build: ./ingestion-service
    container_name: ingestion-service
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092

  alignment-service:
    build: ./alignment-service
    container_name: alignment-service
    volumes:
      - ./ai-bio-platform/data:/data
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - SPRING_KAFKA_CONSUMER_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_KAFKA_PRODUCER_BOOTSTRAP_SERVERS=kafka:29092
  
  variant-calling-service:
    build: ./variant-calling-service
    container_name: variant-calling-service
    volumes:
      - ./ai-bio-platform/data:/data
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - SPRING_KAFKA_CONSUMER_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_KAFKA_PRODUCER_BOOTSTRAP_SERVERS=kafka:29092
  
  persistence-service:
    build: ./persistence-service
    container_name: persistence-service
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/bio_platform_db
      - SPRING_KAFKA_CONSUMER_BOOTSTRAP_SERVERS=kafka:29092
  
  ml-service:
    build: ./ai-bio-platform/ml-service
    container_name: ml-service
    ports:
      - "8001:8001"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
  
  dashboard-ui:
    build: ./dashboard-ui
    container_name: dashboard-ui
    ports:
      - "3000:80" # Map local port 3000 to the container's port 80
    depends_on:
      - ingestion-service
      - ml-service


  mongodb:
    image: mongo:5.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "echo", "hello"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.0.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "echo", "ruok"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.0.1
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "echo", "hello"]
      interval: 15s
      timeout: 10s
      retries: 10

volumes:
  mongodb_data: